name: Build ARM64

on:
  push:
    branches: ["develop", "release"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-aarch64-linux-gnu

    - name: Update Vulkan headers
      run: |
        git clone -b vulkan-sdk-1.4.328 --depth 1 https://github.com/KhronosGroup/Vulkan-Headers /tmp/vkh
        sudo rm -rf /usr/include/{vulkan,vk_video}
        sudo mv /tmp/vkh/include/{vulkan,vk_video} /usr/include/

    - name: Configure (aarch64)
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DLSFGVK_BUILD_VK_LAYER=ON \
          -DLSFGVK_BUILD_UI=OFF \
          -DLSFGVK_BUILD_CLI=OFF

    - name: Build
      run: ninja -C build

    - name: Package
      run: |
        mkdir -p release
        cp build/lsfg-vk-layer/liblsfg-vk-layer.so release/liblsfg-vk-arm64.so
        cp dist/VkLayer_LSFGVK_frame_generation.json release/
        tar -czf lsfg-vk-arm64.tar.gz -C release .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: lsfg-vk-arm64
        path: release/

    - name: Update release
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: latest
        title: "lsfg-vk ARM64 (build ${{ github.run_number }})"
        prerelease: false
        files: lsfg-vk-arm64.tar.gz
